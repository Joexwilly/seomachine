# Autonomous SEO Pipeline Configuration

# Pipeline behaviour
min_score_to_publish: 65        # Articles below this score are saved locally only
min_flesch_score: 25            # Flesch Reading Ease minimum (0=hard, 100=easy). Triggers rewrite if below this.
delay_between_keywords: 5       # Seconds between keywords (be polite to APIs)
batch_size: 0                   # 0 = process all unprocessed keywords
ai_scrub_pass: true             # Set false to skip humanization (cheaper)

# Writing settings
target_language: english
min_word_count: 1800
target_word_count_multiplier: 1.15   # Beat competitors by 15%

# DataForSEO settings
dataforseo_location_code: 2840       # Nigeria=2566, UK=2826, US=2840
dataforseo_language_code: en
dataforseo_fallback_to_scraping: true  # If no DataForSEO creds, use free scraping

# Ghost settings
ghost_post_status: draft        # Always draft — never change to published

# Anthropic settings
anthropic_model: claude-sonnet-4-6
max_tokens_writing: 8000
max_tokens_analysis: 4000
api_retry_delay: 10             # Seconds to wait before retrying failed API calls

# Logging
log_level: INFO
save_research_briefs: true
save_score_reports: true

# Image generation
images_enabled: true             # REPLICATE_API_KEY is set in .env
images_per_article: 3            # Total images: 1 feature + 2 in-article
use_ideogram_for_callouts: true  # Last image uses Ideogram for text-in-image graphic
image_width: 1344                # Flux recommended landscape width
image_height: 768
replicate_model: black-forest-labs/flux-2-pro
